<?xml version="1.0" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 300 100" width="900" height="300" font-family="sans-serif" font-size="10" text-anchor="middle" stroke-linejoin="round" stroke-width="3" paint-order="stroke">
<defs>
<pattern id="back" viewBox="0 0 8 8" width="8" height="8" patternUnits="userSpaceOnUse" fill="#80808044"><rect width="8" height="8" fill="#ffffff33" /><rect width="4" height="4" /><rect x="4" y="4" width="8" height="8" /></pattern>
<path id="shape" d="M0-41L12-17 40-13 20 6 25 33 0 21-25 33-20 6-40-13-12-17Z" fill="url(#c)" />
<linearGradient id="c" x2="0%" y2="100%">
<stop offset="0%" stop-color="#FFCC0000" />
<stop offset="100%" stop-color="#FFCC00FF" />
</linearGradient>
</defs>
<rect width="100%" height="100%" fill="url(#back)" />

<use href="#shape" transform="translate(50 50)" />
<text x="50" y="95" stroke="white">input</text>

<filter id="premult" x="0%" y="0%" width="100%" height="100%">
<feTurbulence
	numOctaves="1"
	baseFrequency="1"
	seed="0"
	type="fractalNoise"
/>
<feComponentTransfer>
	<feFuncA type="linear" slope="0" intercept="1" />
</feComponentTransfer>
<feComposite operator="arithmetic" in2="SourceGraphic" k2="1.50" k3="1" k4="-0.75" />
<feComposite operator="in" in2="SourceAlpha" />
</filter>
<use href="#shape" transform="translate(150 50)" filter="url(#premult)" />
<text x="150" y="95" stroke="white">premultiplied</text>

<filter id="demult" x="0%" y="0%" width="100%" height="100%">
<feComponentTransfer result="r">
	<feFuncA type="linear" slope="0" intercept="1" />
</feComponentTransfer>
<feTurbulence
	numOctaves="1"
	baseFrequency="1"
	seed="0"
	type="fractalNoise"
/>
<feComponentTransfer>
	<feFuncA type="linear" slope="0" intercept="1" />
</feComponentTransfer>
<feComposite operator="arithmetic" in2="r" k2="1.50" k3="1" k4="-0.75" />
<feComposite operator="in" in2="SourceAlpha" />
</filter>
<use href="#shape" transform="translate(250 50)" filter="url(#demult)" />
<text x="250" y="95" stroke="white">non-premultiplied</text>
</svg>
