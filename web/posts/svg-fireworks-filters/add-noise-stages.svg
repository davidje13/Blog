<?xml version="1.0" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 -50 600 100" width="1200" height="200" fill="none" font-family="sans-serif" font-size="16" stroke-linejoin="round" paint-order="stroke">
<defs>
