<?xml version="1.0" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="-150 -50 300 100" width="900" height="300" font-family="sans-serif" font-size="10" text-anchor="middle" stroke-linejoin="round" stroke-width="3" paint-order="stroke">
<defs>
<pattern id="back" viewBox="0 0 8 8" width="8" height="8" patternUnits="userSpaceOnUse" fill="#80808044"><rect width="8" height="8" fill="#ffffff33" /><rect width="4" height="4" /><rect x="4" y="4" width="8" height="8" /></pattern>
<path id="shape" d="M0-41L12-17 40-13 20 6 25 33 0 21-25 33-20 6-40-13-12-17Z" fill="#FFCC00" />
</defs>
<rect x="-150" y="-50" width="100%" height="100%" fill="url(#back)" />

<filter id="zigzag" x="0%" y="0%" width="100%" height="100%">
<feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b" />
<feComponentTransfer result="c">
<feFuncA type="linear" slope="100" intercept="-49" />
</feComponentTransfer>
<feComponentTransfer in="b">
<feFuncA type="table" tableValues="-0.068 0.089 0.180 0.241 0.290 0.331 0.369 0.404 0.437 0.469 0.500 0.531 0.563 0.596 0.631 0.669 0.710 0.759 0.820 0.911 1.068" />
</feComponentTransfer>
<feComponentTransfer>
<feFuncA type="table" tableValues="0 0 0 0 1 0 1" />
</feComponentTransfer>
<feDiffuseLighting surfaceScale="1" kernelUnitLength=".5 .5">
<feDistantLight azimuth="-120" elevation="20" />
</feDiffuseLighting>
<feComposite operator="arithmetic" in="SourceGraphic" k1="1" />
<feComposite operator="in" in2="c" />
</filter>
<use href="#shape" transform="translate(-100 0)" filter="url(#zigzag)" />
<text x="-100" y="45" fill="black" stroke="white">zigzag</text>

<filter id="smooth" x="0%" y="0%" width="100%" height="100%">
<feGaussianBlur in="SourceAlpha" stdDeviation="4" />
<feDiffuseLighting surfaceScale="5" kernelUnitLength=".5 .5">
<feDistantLight azimuth="-120" elevation="20" />
</feDiffuseLighting>
<feComposite operator="arithmetic" in="SourceGraphic" k1="1" />
</filter>
<use href="#shape" filter="url(#smooth)" />
<text x="0" y="45" fill="black" stroke="white">smooth</text>

<filter id="frame">
<feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b" />
<feComponentTransfer result="c">
<feFuncA type="linear" slope="101" intercept="-3" />
</feComponentTransfer>
<feComponentTransfer in="b" result="c2">
<feFuncA type="linear" slope="101" intercept="-98.5" />
</feComponentTransfer>
<feComponentTransfer in="b">
<feFuncA type="table" tableValues="-0.068 0.089 0.180 0.241 0.290 0.331 0.369 0.404 0.437 0.469 0.500 0.531 0.563 0.596 0.631 0.669 0.710 0.759 0.820 0.911 1.068" />
</feComponentTransfer>
<feComponentTransfer>
<feFuncA type="table" tableValues="0 0.5 0.8 0.95 1 0.95 0.8 0.5 0" />
</feComponentTransfer>
<feDiffuseLighting surfaceScale="3" kernelUnitLength=".5 .5" result="s">
<feDistantLight azimuth="-120" elevation="40" />
</feDiffuseLighting>
<feFlood flood-color="#3399FF" />
<feComposite operator="arithmetic" k1="1" in2="s" />
<feComposite operator="out" in2="c2" />
<feComposite operator="over" in2="SourceGraphic" />
<feComposite operator="in" in2="c" />
</filter>
<use href="#shape" transform="translate(100 0)" filter="url(#frame)" />
<text x="100" y="45" fill="black" stroke="white">coloured frame</text>

</svg>
